{{- /* Rules values.schema.json cannot say. A failed rule stops the install with its message. */ -}}
{{- if not .Values.backendUrl -}}
{{- fail "backendUrl: set JAVV's address as the scanners reach it, such as http://javv.javv.svc:8080" -}}
{{- end -}}
{{- if not (or .Values.trivy.enabled .Values.grype.enabled) -}}
{{- fail "trivy.enabled, grype.enabled: enable at least one scanner" -}}
{{- end -}}
{{- range $name := include "javv-scanner.scanners" . | fromJsonArray -}}
{{- $t := (index $.Values $name).token -}}
{{- if (index $.Values $name).enabled -}}
{{- if and $t.existingSecret $t.value -}}
{{- fail (printf "%s.token: set existingSecret or value, not both" $name) -}}
{{- end -}}
{{- if not (or $t.existingSecret $t.value) -}}
{{- fail (printf "%s.token: set existingSecret (the Secret with %s's ingest token under key %q) or value" $name $name $t.key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
