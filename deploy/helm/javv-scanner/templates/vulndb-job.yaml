{{- /*
The first refresh of each scanner's vuln DB, at install. It is also the cache volume's first user:
storage classes that bind a volume only once a pod uses it (most do) would otherwise leave the PVC
Pending until the first scheduled cycle, and `helm install --wait` (ct, Flux) waits for it to bind.
The first cycle then finds a DB in place. Named by a hash of its whole container, so any change to
it (image, DB source, extraEnv, resources, pullPolicy) makes a new Job, which refreshes again (a
Job's pod template cannot change), and the old one is removed.
*/ -}}
{{- range $name := include "javv-scanner.scanners" . | fromJsonArray }}
{{- $s := index $.Values $name }}
{{- if $s.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
{{- $container := include "javv-scanner.refreshContainer" $ctx }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "javv-scanner.fullname" $ }}-{{ $name }}-vulndb-{{ $container | sha256sum | trunc 8 }}
  labels:
    {{- include "javv-scanner.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  activeDeadlineSeconds: {{ $s.activeDeadlineSeconds }}
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: javv-scanner
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
        {{- with $s.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $s.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      # the refresh calls no Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $s.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        {{- $container | nindent 8 }}
      volumes:
        - name: vulndb
          persistentVolumeClaim:
            claimName: {{ include "javv-scanner.claim" $ctx }}
        - name: tmp
          emptyDir: {}
      {{- with $s.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
