{{- /*
`helm test`: for each enabled scanner, its token reaches JAVV at backendUrl and is accepted
(GET /api/v1/scan-scope answers 200, the call each cycle starts with). It proves the address, the
network path and the token without scanning anything. ct install runs it in CI.
*/ -}}
{{- range $name := include "javv-scanner.scanners" . | fromJsonArray }}
{{- $s := index $.Values $name }}
{{- if $s.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "javv-scanner.fullname" $ }}-test-{{ $name }}
  labels:
    {{- include "javv-scanner.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  annotations:
    helm.sh/hook: test
    # kept after a run so `helm test --logs` (and ct install) can read it; the next run replaces it
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml $.Values.podSecurityContext | nindent 4 }}
  containers:
    - name: {{ $name }}
      # the scanner's own image: it has Python, and nothing else needs pulling
      image: {{ include "javv-scanner.image" (dict "root" $ "name" $name) | quote }}
      imagePullPolicy: {{ $s.image.pullPolicy }}
      securityContext:
        {{- toYaml $.Values.securityContext | nindent 8 }}
      env:
        - name: JAVV_BACKEND_URL
          value: {{ $.Values.backendUrl | quote }}
        - name: JAVV_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "javv-scanner.tokenSecret" (dict "root" $ "name" $name) }}
              key: {{ $s.token.key }}
      command:
        - python
        - -c
        - |
          import os, sys, urllib.error, urllib.request

          url = os.environ["JAVV_BACKEND_URL"].rstrip("/") + "/api/v1/scan-scope"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["JAVV_TOKEN"]})
          try:
              with urllib.request.urlopen(req, timeout=15) as res:
                  status = res.status
          except urllib.error.HTTPError as err:
              status = err.code
          except OSError as err:
              sys.exit(f"FAIL: {url} did not answer: {err}")
          if status != 200:
              sys.exit(f"FAIL: {url} answered {status} to {{ $name }}'s token, want 200")
          print("ok: JAVV answers at", url, "and accepts {{ $name }}'s token")
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
{{- end }}
