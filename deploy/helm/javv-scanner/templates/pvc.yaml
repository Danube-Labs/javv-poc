{{- range $name := include "javv-scanner.scanners" . | fromJsonArray }}
{{- $s := index $.Values $name }}
{{- if and $s.enabled (not $s.vulnDb.existingClaim) }}
---
# The scanner's vuln-DB cache (NFR-11): one per scanner, used by one run at a time, so the
# ReadWriteOnce most clusters offer is enough.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "javv-scanner.claim" (dict "root" $ "name" $name) }}
  labels:
    {{- include "javv-scanner.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $s.vulnDb.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $s.vulnDb.size }}
{{- end }}
{{- end }}
