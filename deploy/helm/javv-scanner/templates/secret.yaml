{{- range $name := include "javv-scanner.scanners" . | fromJsonArray }}
{{- $s := index $.Values $name }}
{{- if and $s.enabled (not $s.token.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "javv-scanner.tokenSecret" (dict "root" $ "name" $name) }}
  labels:
    {{- include "javv-scanner.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
type: Opaque
stringData:
  {{ $s.token.key }}: {{ $s.token.value | quote }}
{{- end }}
{{- end }}
