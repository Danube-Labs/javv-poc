# The javv role and its mapping (issue 729), mounted in place of the image's demo ones. The
# compose file carries the same two files as `configs`; backend/tests/test_opensearch_role.py
# holds them equal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-javv-opensearch-security
  labels:
    {{- include "javv-opensearch.labels" . | nindent 4 }}
data:
  roles.yml: |
    {{- .Files.Get "files/roles.yml" | nindent 4 }}
  roles_mapping.yml: |
    {{- .Files.Get "files/roles_mapping.yml" | nindent 4 }}
