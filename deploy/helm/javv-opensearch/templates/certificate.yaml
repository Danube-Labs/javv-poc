{{- $javv := .Values.opensearch.javv -}}
{{- if $javv.tls.certManager.enabled }}
{{- $service := include "javv-opensearch.service" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-javv-opensearch
  labels:
    {{- include "javv-opensearch.labels" . | nindent 4 }}
spec:
  secretName: {{ include "javv-opensearch.tlsSecret" (dict "javv" $javv "Release" .Release) }}
  commonName: {{ $service }}
  dnsNames:
    - {{ $service }}
    - {{ $service }}.{{ .Release.Namespace }}
    - {{ $service }}.{{ .Release.Namespace }}.svc
    - {{ $service }}.{{ .Release.Namespace }}.svc.cluster.local
    - {{ $service }}-headless
    - localhost
  # the node uses one certificate for https and for its transport layer, which needs both
  usages:
    - server auth
    - client auth
    - digital signature
    - key encipherment
  privateKey:
    # OpenSearch reads PKCS#8 keys only
    encoding: PKCS8
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    {{- toYaml $javv.tls.certManager.issuerRef | nindent 4 }}
{{- end }}
