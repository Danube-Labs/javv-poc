# OpenSearch for JAVV (issue 725). Everything sits under `opensearch:`, the official chart's values,
# set to what deploy/compose/compose.yaml runs. JAVV's own keys are under `opensearch.javv`: a
# wrapper chart cannot compute its subchart's values, so they live where the subchart's templated
# fields (config, extraVolumes, extraVolumeMounts, extraInitContainers) and this chart's own
# templates can both read them. Any other key of the official chart can be set here too:
# https://github.com/opensearch-project/helm-charts/blob/main/charts/opensearch/values.yaml

opensearch:
  javv:
    auth:
      # -- A Secret with the admin password under the key `password`. Set this or `password`.
      existingSecret: ""
      # -- The admin password; the chart puts it in a Secret. OpenSearch's rules: 8 characters or
      # more, with upper and lower case, a digit and a special character, and not a common one.
      password: ""
    tls:
      # -- A Secret with your certificate: `tls.crt`, `tls.key` (PKCS#8) and `ca.crt`. Empty, with
      # `certManager.enabled` false: OpenSearch's demo certificates, whose key is public.
      existingSecret: ""
      certManager:
        # -- Ask cert-manager for the certificate, into the Secret `<release>-javv-opensearch-tls`.
        enabled: false
        # -- The cert-manager Issuer or ClusterIssuer to ask: `name`, and `kind` if not Issuer.
        issuerRef: {}
      # -- Subject DNs of client certificates allowed to run OpenSearch's securityadmin.sh, which
      # changing the admin password needs, with your own certificates. The demo setup has its own.
      adminDn: []

  # names: the Service JAVV signs in to is `javv-opensearch` (https, port 9200)
  clusterName: javv-opensearch
  masterService: javv-opensearch

  # -- One node: JAVV runs one store (NFR-9, D23). The install fails with anything else.
  singleNode: true

  image:
    # -- versions.yaml datastore.opensearch; check-versions.sh holds it. Set explicitly because the
    # official chart's version and the OpenSearch it ships can differ.
    tag: "3.9.0"

  # -- The OpenSearch heap, as in compose.
  opensearchJavaOpts: "-Xms1g -Xmx1g"

  persistence:
    # -- Off: the official chart would otherwise add an init container that runs as root on an
    # unpinned busybox image to chown the volume. The pod's `fsGroup` (1000, the official
    # chart's) already makes the volume writable by OpenSearch.
    enableInitChown: false

  # The same settings as the compose file's OpenSearch.
  extraEnvs:
    # JAVV runs its own index lifecycle and does not use query insights; their internal indices
    # would otherwise hold a single node on yellow
    - name: plugins.index_state_management.enabled
      value: "false"
    - name: plugins.index_state_management.history.enabled
      value: "false"
    - name: search.insights.top_queries.latency.enabled
      value: "false"
    - name: search.insights.top_queries.cpu.enabled
      value: "false"
    - name: search.insights.top_queries.memory.enabled
      value: "false"
    # where Settings › Data & OpenSearch takes snapshots, inside the data volume
    - name: path.repo
      value: /usr/share/opensearch/data/snapshots
    # OpenSearch's own audit log is off: it writes a new index every day, and with ISM off
    # nothing deletes them. JAVV keeps its own audit trail. Issue 715.
    - name: plugins.security.audit.type
      value: noop

  # opensearch.yml. With your own certificates it carries the TLS settings, and the image's demo
  # setup then leaves the node alone ("already configured for Security"). Without them the demo
  # setup adds its demo certificates to this file at start. Nothing here may mention
  # plugins.security in demo mode, or the demo setup would skip its certificates.
  config:
    opensearch.yml: |
      cluster.name: {{ .Values.clusterName }}
      network.host: 0.0.0.0
      {{- if include "javv-opensearch.ownCertificates" .Values.javv }}
      plugins.security.ssl.transport.pemcert_filepath: certs/tls.crt
      plugins.security.ssl.transport.pemkey_filepath: certs/tls.key
      plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.crt
      transport.ssl.enforce_hostname_verification: false
      plugins.security.ssl.http.enabled: true
      plugins.security.ssl.http.pemcert_filepath: certs/tls.crt
      plugins.security.ssl.http.pemkey_filepath: certs/tls.key
      plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.crt
      # a renewed certificate is read without a restart; the Secret is mounted as a directory,
      # which Kubernetes updates in place (a subPath mount never sees an update)
      plugins.security.ssl.certificates_hot_reload.enabled: true
      plugins.security.allow_default_init_securityindex: true
      {{- with .Values.javv.tls.adminDn }}
      plugins.security.authcz.admin_dn:
        {{- toYaml . | nindent 2 }}
      {{- end }}
      plugins.security.enable_snapshot_restore_privilege: true
      plugins.security.check_snapshot_restore_write_privileges: true
      plugins.security.restapi.roles_enabled: ["all_access", "security_rest_api_access"]
      plugins.security.system_indices.enabled: true
      {{- end }}

  # Only admin can sign in with a password. The image's users file also holds six demo users
  # whose passwords are their own names, and no setting turns them off (issue 736). This init
  # container writes a file with admin alone, its password hashed from the Secret by OpenSearch's
  # own hash.sh (read from the environment, never a process argument), and the node reads it in
  # place of the image's. OpenSearch loads the file on its first start; later the security index
  # holds the users.
  extraInitContainers: |
    - name: javv-admin-user
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          hash=$(plugins/opensearch-security/tools/hash.sh -env JAVV_ADMIN_PASSWORD | tail -n 1)
          case "$hash" in '$2'*) ;; *) echo "hash.sh gave no bcrypt hash" >&2; exit 1 ;; esac
          printf -- '---\n_meta:\n  type: "internalusers"\n  config_version: 2\nadmin:\n  hash: "%s"\n  reserved: true\n  backend_roles:\n  - "admin"\n  description: "JAVV admin user"\n' "$hash" > /javv-users/internal_users.yml
      env:
        - name: JAVV_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "javv-opensearch.adminSecret" (dict "javv" .Values.javv "Release" .Release) }}
              key: password
      securityContext:
        {{- toYaml .Values.securityContext | nindent 4 }}
      volumeMounts:
        - name: javv-users
          mountPath: /javv-users

  extraVolumes: |
    - name: javv-users
      emptyDir: {}
    {{- if include "javv-opensearch.ownCertificates" .Values.javv }}
    - name: javv-tls
      secret:
        secretName: {{ include "javv-opensearch.tlsSecret" (dict "javv" .Values.javv "Release" .Release) }}
    {{- end }}

  extraVolumeMounts: |
    - name: javv-users
      mountPath: /usr/share/opensearch/config/opensearch-security/internal_users.yml
      subPath: internal_users.yml
    {{- if include "javv-opensearch.ownCertificates" .Values.javv }}
    - name: javv-tls
      mountPath: /usr/share/opensearch/config/certs
      readOnly: true
    {{- end }}
