# ct install: a certificate from cert-manager, through the CA Issuer javv-ci-ca the CI job sets
# up. Small, and no volume, so each case starts a fresh store.
opensearch:
  javv:
    auth:
      existingSecret: javv-ci-admin
    backend:
      existingSecret: javv-ci-backend
    tls:
      certManager:
        enabled: true
        issuerRef:
          name: javv-ci-ca
  opensearchJavaOpts: "-Xms512m -Xmx512m"
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
  persistence:
    enabled: false
  terminationGracePeriod: 5
