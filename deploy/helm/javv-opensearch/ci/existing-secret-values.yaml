# ct install: a certificate from the Secret javv-ci-tls, which the CI job makes with openssl. Small,
# and no volume, so each case starts a fresh store.
opensearch:
  javv:
    auth:
      existingSecret: javv-ci-admin
    backend:
      existingSecret: javv-ci-backend
    tls:
      existingSecret: javv-ci-tls
  opensearchJavaOpts: "-Xms512m -Xmx512m"
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
  persistence:
    enabled: false
  terminationGracePeriod: 5
