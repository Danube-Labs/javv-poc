# chart-testing (ct) for the charts in deploy/helm (issue 725), run by CI's Helm charts job.
chart-dirs:
  - deploy/helm
target-branch: main
# release-please sets every chart's version to the JAVV release, so a chart change does not bump it
check-version-increment: false
validate-maintainers: false
# the official chart javv-opensearch depends on (vendored in its charts/ folder)
chart-repos:
  - opensearch=https://opensearch-project.github.io/helm-charts
# installs go into the namespace development/scripts/helm-ci-fixtures.sh prepares; each
# ci/*-values.yaml is one install, then `helm test --logs`, then an uninstall
namespace: javv-ci
release-label: app.kubernetes.io/instance
helm-extra-args: --timeout 600s
