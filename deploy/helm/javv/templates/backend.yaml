{{- $b := .Values.backend -}}
{{- $ca := .Values.opensearch.caSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "javv.backendService" . }}
  labels:
    {{- include "javv.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # One backend (issue 691): it runs the background jobs itself, and a rolling update would briefly
  # run two. Recreate stops the old pod before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "javv.selector" (dict "root" $ "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "javv.selector" (dict "root" $ "component" "backend") | nindent 8 }}
        {{- with $b.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $b.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with $b.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ $b.image.repository }}:{{ $b.image.tag }}"
          imagePullPolicy: {{ $b.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- range $name, $value := $b.config }}
            {{- if not (and $ca.name (has $name (list "JAVV_OPENSEARCH_CA_BUNDLE" "JAVV_OPENSEARCH_VERIFY_CERTS"))) }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- end }}
            {{- if $ca.name }}
            - name: JAVV_OPENSEARCH_CA_BUNDLE
              value: {{ printf "%s/%s" (include "javv.caDir" .) $ca.key | quote }}
            - name: JAVV_OPENSEARCH_VERIFY_CERTS
              value: "true"
            {{- end }}
            - name: JAVV_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "javv.secretName" . }}
                  key: token-pepper
            - name: JAVV_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "javv.secretName" . }}
                  key: bootstrap-admin-password
            - name: JAVV_OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opensearch.passwordSecret.name }}
                  key: {{ .Values.opensearch.passwordSecret.key }}
            {{- with $b.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml $b.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $b.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $b.livenessProbe | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with $b.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $ca.name }}
            - name: opensearch-ca
              mountPath: {{ include "javv.caDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $ca.name }}
        - name: opensearch-ca
          secret:
            secretName: {{ $ca.name }}
            items:
              - key: {{ $ca.key }}
                path: {{ $ca.key }}
        {{- end }}
      {{- with $b.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# The frontend forwards /api, /auth and /readyz here. A Prometheus scrape of /metrics (no sign-in)
# can use it too; it is not meant to be published.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "javv.backendService" . }}
  labels:
    {{- include "javv.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "javv.selector" (dict "root" $ "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
