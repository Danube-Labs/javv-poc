{{- /* Rules values.schema.json cannot say. A failed rule stops the install with its message. */ -}}
{{- $s := .Values.secrets -}}
{{- if and $s.existingSecret (or $s.secretKey $s.bootstrapAdminPassword) -}}
{{- fail "secrets: set existingSecret, or secretKey and bootstrapAdminPassword, not both" -}}
{{- end -}}
{{- if and (not $s.existingSecret) (not (and $s.secretKey $s.bootstrapAdminPassword)) -}}
{{- fail "secrets: set existingSecret (keys secret-key and bootstrap-admin-password), or both secretKey and bootstrapAdminPassword" -}}
{{- end -}}
{{- if not .Values.opensearch.passwordSecret.name -}}
{{- fail "opensearch.passwordSecret.name: name the Secret with javv's OpenSearch password (the javv-opensearch chart's backend Secret)" -}}
{{- end -}}
{{- if and .Values.opensearch.caSecret.name .Values.backend.config.JAVV_OPENSEARCH_CA_BUNDLE -}}
{{- fail "backend.config.JAVV_OPENSEARCH_CA_BUNDLE: leave it empty; opensearch.caSecret sets it" -}}
{{- end -}}
