# `helm test`: through the frontend Service, the backend answers and the store is reachable
# (/readyz 200), and a sign-in reaches the backend's login (a wrong password is refused with 401).
# A wrong password, so the test holds after the bootstrap admin's password is changed. ct install
# runs it in CI.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "javv.fullname" . }}-test-frontend
  labels:
    {{- include "javv.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # kept after a run so `helm test --logs` (and ct install) can read it; the next run replaces it
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: frontend
      # the backend image: it has Python, and no other image needs pulling
      image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
      imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      env:
        - name: BASE
          value: http://{{ include "javv.fullname" . }}:{{ .Values.frontend.service.port }}
        - name: USERNAME
          value: {{ .Values.backend.config.JAVV_BOOTSTRAP_ADMIN_USERNAME | quote }}
      command:
        - python
        - -c
        - |
          import json, os, sys, time, urllib.error, urllib.request

          base = os.environ["BASE"]

          def call(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, method="POST" if data else "GET")
              req.add_header("content-type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=10) as res:
                      return res.status, res.read()
              except urllib.error.HTTPError as err:
                  return err.code, err.read()

          for _ in range(30):  # the backend's first start creates the indices
              status, body = call("/readyz")
              if status == 200:
                  break
              time.sleep(5)
          if status != 200:
              sys.exit(f"FAIL: /readyz through the frontend answered {status}: {body[:200]!r}")

          wrong = {"username": os.environ["USERNAME"], "password": "not-the-password-725"}
          status, body = call("/auth/login", wrong)
          if status != 401:
              sys.exit(f"FAIL: a wrong password got {status}, want 401")
          print("ok: the frontend reaches the backend, the store is ready, sign-in answers")
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
