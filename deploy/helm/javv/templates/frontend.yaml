{{- $f := .Values.frontend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "javv.fullname" . }}-frontend
  labels:
    {{- include "javv.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ $f.replicas }}
  selector:
    matchLabels:
      {{- include "javv.selector" (dict "root" $ "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "javv.selector" (dict "root" $ "component" "frontend") | nindent 8 }}
        {{- with $f.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $f.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with $f.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ $f.image.repository }}:{{ $f.image.tag }}"
          imagePullPolicy: {{ $f.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $name, $value := $f.config }}
            - name: {{ $name }}
              {{- if and (eq $name "JAVV_BACKEND_URL") (not $value) }}
              value: {{ printf "http://%s:8000" (include "javv.backendService" $) | quote }}
              {{- else }}
              value: {{ $value | toString | quote }}
              {{- end }}
            {{- end }}
            - name: JAVV_FRONTEND_PORT
              value: "8080"
            {{- with $f.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            {{- toYaml $f.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $f.livenessProbe | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with $f.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $f.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# The address browsers and scanners use (no Ingress: what sits in front is yours, issue 452).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "javv.fullname" . }}
  labels:
    {{- include "javv.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ $f.service.type }}
  selector:
    {{- include "javv.selector" (dict "root" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ $f.service.port }}
      targetPort: http
