# ct install: the app next to a javv-opensearch store with a cert-manager certificate, in the same
# namespace, which the CI job installs first: its password Secret and its CA, so the backend checks
# the store's certificate. The pepper and the bootstrap password are throwaway values.
secrets:
  tokenPepper: ci-only-pepper-for-the-helm-check
  bootstrapAdminPassword: ci-only-admin-passphrase
opensearch:
  passwordSecret:
    name: javv-ci-admin
  caSecret:
    name: store-javv-opensearch-tls
backend:
  config:
    # the store's Service in this namespace; its certificate names this address
    JAVV_OPENSEARCH_URL: "https://javv-opensearch:9200"
