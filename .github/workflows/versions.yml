name: Versions drift

# D42: versions.yaml is the single source of truth for externally-owned tool/service versions.
# Consumers (scanner Dockerfiles, dev OpenSearch compose, CI service images and setup-node, the
# pyproject ruff/pyright pins, the pre-commit ruff hook, the bake defaults, and the docs that state
# the supported versions) keep a literal pin so they work standalone; this gate fails if any
# consumer drifts from versions.yaml, or a Python copy from backend/.python-version.
# Fix: check-versions.sh --fix.

on:
  pull_request:
    paths:
      - 'versions.yaml'
      - 'scanner/Dockerfile.*'
      - 'development/setup/opensearch-dev.yml'
      - 'development/scripts/check-versions.sh'
      - 'development/scripts/check-scanner-db-policy.sh'
      - '.github/workflows/versions.yml'
      - '.github/workflows/clock-drift.yml'
      - '.github/workflows/ci.yml'
      - 'backend/pyproject.toml'
      - 'scanner/pyproject.toml'
      - 'libs/javv-common/pyproject.toml'
      - 'backend/.python-version'
      - 'scanner/.python-version'
      - '.pre-commit-config.yaml'
      - 'README.md'
      - 'docs/CONFIGURATION.md'
      - 'scanner/README.md'
      - 'scanner/docker-bake.hcl'
      - '.github/workflows/scanner-images.yml'
  push:
    branches: [main]
    paths:
      - 'versions.yaml'
      - 'scanner/Dockerfile.*'
      - 'development/setup/opensearch-dev.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/clock-drift.yml'
      - 'backend/pyproject.toml'
      - 'scanner/pyproject.toml'
      - 'libs/javv-common/pyproject.toml'
      - 'backend/.python-version'
      - 'scanner/.python-version'
      - '.pre-commit-config.yaml'
      - 'README.md'
      - 'docs/CONFIGURATION.md'
      - 'scanner/README.md'
      - 'scanner/docker-bake.hcl'
      - '.github/workflows/scanner-images.yml'

permissions:
  contents: read

jobs:
  drift:
    name: Pins match versions.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Consumer pins match versions.yaml
        run: development/scripts/check-versions.sh
      - name: No supported scanner runs a frozen/incompatible vuln DB (M0b)
        run: development/scripts/check-scanner-db-policy.sh
